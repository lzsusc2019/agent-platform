[project]
name = "agent-platform"
version = "0.1.0"
description = "MVP skeleton for the 灵枢 Agent Middleware Platform — ReAct Loop, Checkpoint persistence, HITL approval, SSE streaming. Sandbox / hot reload / MCP are stubbed for future work."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "lzsusc2019" },
]
keywords = [
    "agent",
    "llm",
    "react",
    "hitl",
    "checkpoint",
    "middleware",
    "platform",
    "ai-agents",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    # Web
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sse-starlette>=2.1.3",
    # Data
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    # Storage
    "redis>=5.0.0",
]

[project.optional-dependencies]
# NOTE: deliberately no extra for "real providers". Adding one is an ~80-line
# ChatModel subclass plus register_provider() — see ADR-002 and
# agent_platform/core/providers.py. Pulling in a framework for that is the
# thing this project decided against.
# Dashboard / admin (future)
test = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "fakeredis>=2.24.0",
    "httpx>=0.27.0",
    "respx>=0.21.0",
]
dev = [
    "ruff>=0.7.0",
    "mypy>=1.13.0",
]

[project.urls]
Repository = "https://github.com/lzsusc2019/agent-platform"
Issues = "https://github.com/lzsusc2019/agent-platform/issues"

[project.scripts]
agent-platform = "agent_platform.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_platform"]

[tool.pytest.ini_options]
testpaths = ["resource/tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
    "E501",  # line length is the formatter job
    "B008",  # FastAPI Depends()/Query() is a call in a default, by design
    # (str, Enum) rather than StrEnum: str(member) differs between the two
    # ("EventType.START" vs "start"), and f-strings and log lines here depend
    # on the explicit form. Migrating changes behaviour for no functional
    # gain, so this is a deliberate no.
    "UP042",
    # Exception names are part of the contract: admin SSE frames publish
    # error_type as the class name, and callers import these directly.
    # Renaming them is a breaking change, not a lint fix.
    "N818",
]

[tool.ruff.lint.per-file-ignores]
# The prompts ARE the test data: fullwidth punctuation is what a Chinese user
# actually types, so "ambiguous" characters are the point, not a typo.
"scripts/probe_natural_language.py" = ["RUF001"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
